[package]
name = "zenohx"
version = "0.7.1"
default-run = "zenohx"
description = "ZenohX - Modern, high-performance desktop GUI client for Eclipse Zenoh"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/hakanlundvall/ZenohX"
homepage = "https://github.com/hakanlundvall/ZenohX"
readme = "../README.md"
keywords = ["zenoh", "gui", "desktop", "robotics", "iot"]
categories = ["development-tools", "gui", "network-programming"]

[lib]
name = "zenohx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zenohx"
path = "src/main.rs"

[[bin]]
name = "zenohx-mcp"
path = "src/bin/zenohx-mcp.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
zenoh = { version = "1.10.0", features = ["unstable"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4", "v5", "serde"] }
ciborium = "0.2"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
mdns-sd = "0.21.1"
if-addrs = "0.13"
futures = "0.3"
toml = "0.8"
toml_edit = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }

# Optimized development and test profile for fast iteration
[profile.dev]
debug = 1 # Line tables only: cuts debug symbols by ~70% while preserving clean backtraces
opt-level = 0

# High-performance parallelized release profile
[profile.release]
opt-level = 3
codegen-units = 16 # Parallelize LLVM codegen across CPU cores
lto = "thin"       # Thin LTO links 3x faster than full fat LTO
strip = true       # Automatically strip symbols for compact binaries

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend tests & typechecks
        run: npm test

      - name: Run frontend build check
        run: npm run build

  rust-tests:
    name: Rust Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Install Linux system dependencies & mold linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            clang

      - name: Install npm dependencies
        run: npm ci

      - name: Configure Windows Test Environment
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $debugDir = Join-Path (Get-Location) "src-tauri\target\debug"
          New-Item -ItemType Directory -Force -Path $debugDir
          echo "$debugDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Rust backend tests (Linux with mold)
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust backend tests (macOS & Windows)
        if: runner.os != 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml
